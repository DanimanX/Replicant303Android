name: play

# Builds a signed Android App Bundle and uploads it to Google Play.
# Requires the Play service account secret; without it the job fails loudly
# instead of pretending the release happened.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to upload (for example 1.0.1)'
        required: true
        default: '1.0.1'
      track:
        description: 'Play track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: 'Release status on the track'
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: read

concurrency:
  group: play-${{ inputs.track }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.REPLICANT_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.REPLICANT_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.REPLICANT_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.REPLICANT_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - name: Check publishing credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${KEYSTORE_BASE64:-}" ] || missing+=("REPLICANT_KEYSTORE_BASE64")
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing+=("REPLICANT_KEYSTORE_PASSWORD")
          [ -n "${KEY_ALIAS:-}" ] || missing+=("REPLICANT_KEY_ALIAS")
          [ -n "${KEY_PASSWORD:-}" ] || missing+=("REPLICANT_KEY_PASSWORD")
          [ -n "${PLAY_SERVICE_ACCOUNT_JSON:-}" ] || missing+=("PLAY_SERVICE_ACCOUNT_JSON")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. See docs/PLAY_STORE.md."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)"
          fi
          echo "Using $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not semver (expected MAJOR.MINOR.PATCH)."
            exit 1
          fi
          CORE="${VERSION%%-*}"
          MAJOR="${CORE%%.*}"
          REST="${CORE#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Uploading $VERSION (versionCode $CODE) to ${{ inputs.track }} as ${{ inputs.status }}"

      - name: Decode upload keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "REPLICANT_KEYSTORE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release bundle
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace \
            -PreplicantVersionName="${{ steps.version.outputs.version }}" \
            -PreplicantVersionCode="${{ steps.version.outputs.code }}"

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_SDK_ROOT}/build-tools/36.0.0"
          APK="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)"
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' | head -1)"
          [ -n "$APK" ] && [ -n "$AAB" ] || { echo "::error::Missing release artifacts."; exit 1; }

          "$BT/aapt2" dump badging "$APK" \
            | grep -E "^package:|^targetSdkVersion|^native-code" | tee badging.txt

          TARGET="$(sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p" badging.txt)"
          CODE="$(sed -n "s/^package:.*versionCode='\([0-9]*\)'.*/\1/p" badging.txt | head -1)"
          if [ "${TARGET:-0}" -lt 36 ]; then
            echo "::error::targetSdk ${TARGET} is below the level Play requires for new apps (36)."
            exit 1
          fi
          if [ "$CODE" != "${{ steps.version.outputs.code }}" ]; then
            echo "::error::versionCode $CODE does not match the requested ${{ steps.version.outputs.code }}."
            exit 1
          fi
          jarsigner -verify "$AAB" | grep -q "jar verified" \
            || { echo "::error::The AAB is not signed with the upload key."; exit 1; }
          sha256sum "$AAB" "$APK"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.danimanx.replicant303
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: store/release-notes
          changesNotSentForReview: false
