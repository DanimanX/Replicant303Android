name: release

# Builds the installable Android APK (+ AAB) and publishes a GitHub Release.
# Trigger it by pushing a version tag (1.0.1 or v1.0.1) or manually.
on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (for example 1.0.1)'
        required: true
        default: '1.0.1'
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.REPLICANT_KEYSTORE_BASE64 }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)"
          fi
          echo "Using $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not semver (expected MAJOR.MINOR.PATCH)."
            exit 1
          fi
          CORE="${VERSION%%-*}"
          MAJOR="${CORE%%.*}"
          REST="${CORE#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "Publishing Replicant303 Android $VERSION (versionCode $CODE)"

      # Optional real signing. Without these secrets the release APK is signed
      # with the CI debug key so it still installs on any device.
      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/replicant-release.keystore"
          echo "REPLICANT_KEYSTORE=$RUNNER_TEMP/replicant-release.keystore" >> "$GITHUB_ENV"
          echo "REPLICANT_KEYSTORE_PASSWORD=${{ secrets.REPLICANT_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "REPLICANT_KEY_ALIAS=${{ secrets.REPLICANT_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "REPLICANT_KEY_PASSWORD=${{ secrets.REPLICANT_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK and AAB
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace \
            -PreplicantVersionName="${{ steps.version.outputs.version }}" \
            -PreplicantVersionCode="${{ steps.version.outputs.code }}"

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          APK="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)"
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          cp "$APK" "dist/Replicant303-Android-${VERSION}.apk"
          if [ -n "$AAB" ]; then
            cp "$AAB" "dist/Replicant303-Android-${VERSION}.aab"
          fi

          # Verify the APK is signed and carries the expected version.
          BT="${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose "dist/Replicant303-Android-${VERSION}.apk"
          "$BT/aapt2" dump badging "dist/Replicant303-Android-${VERSION}.apk" \
            | grep -E "^package:|^native-code:" | tee dist/badging.txt
          grep -q "versionName='${VERSION}'" dist/badging.txt

          FILES=(dist/*.apk)
          for bundle in dist/*.aab; do
            [ -e "$bundle" ] && FILES+=("$bundle")
          done
          sha256sum "${FILES[@]}" | sed 's#  dist/#  #' > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: replicant303-android-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Replicant303 Android ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Replicant303 Android ${{ steps.version.outputs.version }}

            Low-latency analog bassline synthesizer and sequencer for Android.

            - **APK**: `Replicant303-Android-${{ steps.version.outputs.version }}.apk` — sideload on Android 8.0+ (arm64-v8a / x86_64).
            - **AAB**: Google Play Store App Bundle.
            - **SHA256SUMS.txt**: checksums for the attached binaries.

            Built from `${{ github.sha }}` by GitHub Actions.
            Install APK: `adb install -r Replicant303-Android-${{ steps.version.outputs.version }}.apk`
          files: |
            dist/Replicant303-Android-${{ steps.version.outputs.version }}.apk
            dist/Replicant303-Android-${{ steps.version.outputs.version }}.aab
            dist/SHA256SUMS.txt
